name: CI

on:
  pull_request:
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'
  push:
    branches:
      - main
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate profile Markdown
        run: |
          set -euo pipefail

          if grep -Eq 'GitHub Signals|ACTIVITY-MIX|```mermaid|Последние 12 месяцев|Last 12 months' README.md README.en.md; then
            echo "Removed GitHub activity block is still present."
            exit 1
          fi

          for readme in README.md README.en.md; do
            stack_rows=$(grep -E '^\| (Языки|Backend|Качество|Languages|Quality) \|' "$readme")
            badge_count=$(printf '%s\n' "$stack_rows" | grep -o '!\[' | wc -l)
            linked_badge_count=$(printf '%s\n' "$stack_rows" | grep -o '\[!\[' | wc -l)
            test "$badge_count" -eq 12
            test "$linked_badge_count" -eq 12
          done
